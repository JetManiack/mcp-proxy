{{define "content"}}
<a href="/ui/tokens" class="back-link">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Tokens
</a>

<div class="page-header">
  <div>
    <h1 class="page-title">Token created</h1>
    <p class="page-desc">Token <strong>{{.Name}}</strong> is ready.</p>
  </div>
</div>

<div class="card" style="max-width:580px">
  <div class="card-body">
    <div class="alert alert-warn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L14.5 13.5H1.5L8 1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.5" r=".75" fill="currentColor"/></svg>
      Copy this token now. It will <strong>not</strong> be shown again.
    </div>

    <label style="display:block;margin-bottom:8px">Bearer token</label>
    <div class="token-box">
      <span class="token-val" id="tok">{{.Token}}</span>
      <button class="copy-btn" onclick="copyToken(this)" type="button">Copy</button>
    </div>

    <p style="font-size:12.5px;color:var(--fg-3);margin-top:12px;line-height:1.6">
      Add to your MCP client config:<br>
      <code style="font-family:'JetBrains Mono',monospace;font-size:11.5px">Authorization: Bearer &lt;token&gt;</code>
    </p>

    <div class="form-actions" style="margin-top:24px">
      <a href="/ui/tokens" class="btn btn-secondary">Back to tokens</a>
    </div>
  </div>
</div>

<script>
function copyToken(btn) {
  var val = document.getElementById('tok').textContent;
  navigator.clipboard.writeText(val).then(function(){
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(function(){ btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
  }).catch(function(){
    var r = document.createRange();
    r.selectNode(document.getElementById('tok'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
  });
}
</script>
{{end}}
